name: E2E Chaos Tests

on:
  push:
    branches:
      - flare-operator
      - master
  pull_request:
    branches:
      - flare-operator
      - master

jobs:
  chaos-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Create kind cluster
        run: kind create cluster --config test/chaos/kind-config.yaml --name flare-chaos --wait 120s

      - name: Install Calico CNI
        continue-on-error: true
        run: |
          # Remove default kindnet CNI
          kubectl delete daemonset -n kube-system kindnet || true
          # Install Calico for NetworkPolicy support
          kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.27.0/manifests/calico.yaml
          # Wait for Calico to be ready
          kubectl -n kube-system wait --for=condition=Ready pods -l k8s-app=calico-node --timeout=120s || true
          kubectl -n kube-system wait --for=condition=Ready pods -l k8s-app=calico-kube-controllers --timeout=120s || true

      - name: Build flare-operator image
        run: docker build -t flare-operator:test -f Dockerfile.operator .

      - name: Build flare-node image
        run: docker build -t flare-node:test -f Dockerfile.flare-node .

      - name: Load images into kind
        run: |
          kind load docker-image flare-operator:test --name flare-chaos
          kind load docker-image flare-node:test --name flare-chaos

      - name: Create namespace
        run: kubectl create namespace flare-system

      - name: Deploy CRD
        run: kubectl apply -f deploy/crd.yaml

      - name: Deploy RBAC
        run: kubectl apply -f deploy/rbac.yaml

      - name: Deploy operator
        run: |
          sed 's|flare-operator:latest|flare-operator:test|;s|IfNotPresent|Never|;s|value: "default"|value: "chaos-test"|' \
            deploy/operator.yaml | kubectl apply -f -

      - name: Wait for operator rollout
        run: kubectl rollout status deployment/flare-operator -n flare-system --timeout=120s

      - name: Deploy FlareCluster CR
        run: kubectl apply -f test/chaos/flare-cluster.yaml

      - name: Deploy flare nodes
        run: kubectl apply -f test/chaos/flare-nodes.yaml

      - name: Wait for flare nodes rollout
        run: |
          kubectl rollout status statefulset/flare-nodes -n flare-system --timeout=300s

      - name: Run chaos tests
        run: bash test/chaos/run_chaos_tests.sh

      - name: Run cluster replication E2E tests
        run: bash test/e2e/run-all.sh

      - name: Dump operator logs
        if: failure()
        run: |
          echo "=== Operator Logs ==="
          kubectl logs -n flare-system -l app=flare-operator --tail=200 || true

      - name: Dump flare node logs
        if: failure()
        run: |
          echo "=== Flare Node Logs ==="
          for pod in $(kubectl get pods -n flare-system -l app=flare,cluster=chaos-test -o name); do
            echo "--- ${pod} ---"
            kubectl logs -n flare-system "${pod}" --tail=50 || true
          done

      - name: Dump K8s events and pod descriptions
        if: failure()
        run: |
          echo "=== K8s Events ==="
          kubectl get events -n flare-system --sort-by='.lastTimestamp' || true
          echo ""
          echo "=== Pod Descriptions ==="
          kubectl describe pods -n flare-system || true
          echo ""
          echo "=== ConfigMaps ==="
          kubectl get configmaps -n flare-system -o yaml || true

      - name: Delete kind cluster
        if: always()
        run: kind delete cluster --name flare-chaos
