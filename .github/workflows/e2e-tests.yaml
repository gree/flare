name: E2E Tests

on:
  # Feature branches are covered by their pull_request runs; running the same
  # suite again on push produced duplicate hour-long runs of identical code
  # (and confusing split verdicts when one of the pair hit a flake).
  push:
    branches:
      - master
  pull_request:
    branches:
      - flare-operator
      - master

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  e2e-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The operator's RBAC lives twice (helm chart + deploy/rbac.yaml for
      # this CI). The nodes rule was once missing from BOTH; the next
      # failure mode is fixing only one copy. Fail fast on divergence.
      - name: RBAC parity (helm chart vs deploy/rbac.yaml)
        run: |
          helm template flare helm/flare-operator > /tmp/chart-rendered.yaml
          python3 - <<'EOF'
          import yaml, sys
          def rules(path):
              for d in yaml.safe_load_all(open(path)):
                  if d and d.get('kind') == 'ClusterRole' and 'rules' in d:
                      return d['rules']
              return None
          norm = lambda rs: sorted(
              (tuple(sorted(r.get('apiGroups', []))),
               tuple(sorted(r.get('resources', []))),
               tuple(sorted(r.get('verbs', []))))
              for r in rs)
          a = norm(rules('/tmp/chart-rendered.yaml'))
          b = norm(rules('deploy/rbac.yaml'))
          if a != b:
              print('ClusterRole rules diverge between the helm chart and deploy/rbac.yaml')
              print('chart:', *a, sep='\n  ')
              print('repo :', *b, sep='\n  ')
              sys.exit(1)
          print('RBAC rules in sync:', len(a), 'rules')
          EOF

      - name: Install elan (Lean version manager)
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Install helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Build Lean operator
        run: |
          cd flare_operator
          lake build FlareOperator flare_operator flare_e2e

      - name: Create kind cluster
        run: kind create cluster --name flare-e2e --wait 120s

      - name: Build Docker images
        run: |
          docker build -t flare-operator:test -f Dockerfile.operator .
          docker build -t flare-node:test -f Dockerfile.flare-node .
          docker build -t flare-node-rocksdb:test -f Dockerfile.flare-node-rocksdb .

      - name: Load images into kind
        run: |
          kind load docker-image flare-operator:test --name flare-e2e
          kind load docker-image flare-node:test --name flare-e2e
          kind load docker-image flare-node-rocksdb:test --name flare-e2e

      - name: Create namespace
        run: kubectl create namespace flare-system --dry-run=client -o yaml | kubectl apply -f -

      - name: Install CRD
        run: kubectl apply -f deploy/crd.yaml

      - name: Install RBAC
        run: kubectl apply -f deploy/rbac.yaml

      - name: Deploy operator
        run: |
          # Use simple deployment manifest instead of Helm to avoid timeout issues in CI
          sed 's|flare-operator:latest|flare-operator:test|;s|IfNotPresent|Never|' \
            deploy/operator.yaml | kubectl apply -f -

      - name: Wait for operator ready
        run: |
          # bash -e used to abort before the diagnostics on rollout
          # timeout — dump everything unconditionally, THEN fail.
          if ! kubectl rollout status deployment/flare-operator -n flare-system --timeout=300s; then
            echo "=== ROLLOUT TIMED OUT — diagnostics ==="
            kubectl get pods -n flare-system -o wide
            kubectl describe deployment/flare-operator -n flare-system | tail -20
            for p in $(kubectl get pods -n flare-system -o name); do
              echo "=== describe $p (events) ==="
              kubectl describe "$p" -n flare-system | grep -A12 "^Events:"
              echo "=== logs $p ==="
              kubectl logs "$p" -n flare-system --tail=60 || true
            done
            kubectl get events -n flare-system --sort-by=.lastTimestamp | tail -20
            exit 1
          fi
          echo "=== Operator pods ==="
          kubectl get pods -n flare-system
          echo "=== Operator logs (initial) ==="
          kubectl logs -n flare-system -l app=flare-operator --tail=50

      - name: Run E2E tests
        run: |
          cd flare_operator
          export KUBECONFIG=$HOME/.kube/config
          timeout 5400 .lake/build/bin/flare_e2e

      - name: Dump operator logs on failure
        if: failure()
        run: |
          # Suites run their own operator in per-suite namespaces (flare-*),
          # so dump every one of them — a fixed -n flare-system misses the
          # namespace of the suite that actually failed.
          for ns in $(kubectl get ns -o name | sed 's|namespace/||' | grep '^flare-'); do
            echo "=== Operator Logs ($ns) ==="
            kubectl logs -n "$ns" -l app=flare-operator --tail=300 --prefix || true
            echo "=== flared Logs ($ns, tail 100 each) ==="
            kubectl logs -n "$ns" -l app=flare --tail=100 --prefix || true
          done

      - name: Dump K8s state on failure
        if: failure()
        run: |
          echo "=== All Namespaces ==="
          kubectl get ns || true
          echo ""
          echo "=== All Pods ==="
          kubectl get pods --all-namespaces || true
          echo ""
          echo "=== Events (all namespaces) ==="
          kubectl get events --all-namespaces --sort-by='.lastTimestamp' || true
          echo ""
          echo "=== FlareCluster CRs ==="
          kubectl get flareclusters --all-namespaces -o yaml || true

      - name: Delete kind cluster
        if: always()
        run: kind delete cluster --name flare-e2e
