name: E2E Tests

on:
  # Feature branches are covered by their pull_request runs; running the same
  # suite again on push produced duplicate hour-long runs of identical code
  # (and confusing split verdicts when one of the pair hit a flake).
  push:
    branches:
      - master
  pull_request:
    branches:
      - flare-operator
      - master
      # Stacked safety PRs (base = another safety/* branch, so the diff is
      # only the new work) must still run the E2E matrix.
      - 'safety/**'
  # Manual run of a branch (e.g. re-running a leg for evidence).
  workflow_dispatch:
    inputs:
      evaluation:
        description: 'Optional evaluation on the continuous-replication leg (PR runs use none)'
        type: choice
        options: [none, sustained, scale-2m, scale-15m8]
        default: none

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.head_ref || github.ref }}-${{ inputs.evaluation || 'none' }}
  cancel-in-progress: true

jobs:
  e2e-test:
    runs-on: ubuntu-latest
    # The serial suite grew past 2.5h, so it is SHARDED into parallel matrix
    # legs (each leg: ~30 min setup + its suite group). Groups are balanced
    # by measured suite duration — circuit-breaker (~22 min) and blue-green
    # (~15 min) anchor their own leg. Rebalance by editing the lists; add
    # new suites to a group or `flare_e2e --list` drifts from reality (the
    # aggregate job below fails if a suite is left out of every group).
    timeout-minutes: ${{ inputs.evaluation != '' && inputs.evaluation != 'none' && 240 || 120 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: topology
            suites: "failover,read-balance,scale-out-master,scale-out-slave,scale-in-slave,scale-in-master"
          - group: replication
            suites: "replace-nodes,cluster-replication,partition-reduction,wal-retention-config,strict-durability,snapshot-push-seed,continuous-replication-purge,continuous-replication-limits"
          - group: wal-recovery
            suites: "wal-bandwidth-throttle,wal-incremental-sync,wal-purged-fallback,resync-failure-self-demote,orphan-scan-purge,terminating-pod-handling,failover-during-replication,data-survival-failover,pvc-data-survival,backup-restore"
          - group: breaker-migration
            suites: "circuit-breaker,operator-restart,topology-authority,replica-repair,prepare-evidence,native-metrics,blue-green-migration"
          # SAF-10d acceptance. Scale/sustained suites are opt-in evaluations;
          # their default SKIP is not evidence that performance was tested.
          # with real link cuts, an operator restart, a failover and a
          # scale-out; ~50 min locally, so it anchors its own leg.
          - group: continuous-replication
            suites: "continuous-replication,continuous-replication-scale,continuous-replication-sustained"
    name: e2e-test (${{ matrix.group }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install elan (Lean version manager)
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Install helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Test Helm startup memory configuration
        # Helm is installed above; test startup ConfigMap seeding before builds.
        # Full runtime/config admission tests run in the replication shard.
        # Keep this a separate step so a render failure cannot hide in a pipe.
        run: python3 -m unittest discover -s scripts/tests -p 'test_helm_memory.py'

      - name: Build Lean operator and tests
        run: |
          cd flare_operator
          # SEPARATE invocations on purpose. Naming the library and an
          # executable whose root is one of its modules (flare_operator is
          # rooted at FlareOperator.Main) in ONE parallel `lake build` races:
          # lake can emit Main:c.o from the LIBRARY elaboration — which has no
          # `main` entry point — before the executable-root elaboration runs,
          # and the link then dies with `ld.lld: error: undefined symbol:
          # main`. Seen 2026-09-09 after months of the combined command
          # passing; the build order in a good run is Main → Main → Main:c.o,
          # in the bad one Main → Main:c.o → Main.
          build_all() {
            lake build FlareOperator \
              && lake build flare_operator \
              && lake build flare_unit \
              && lake build flare_e2e
          }
          # Retry once from a CLEAN tree. The runner's clang also dies with
          # SIGBUS (exit 135) occasionally (two consecutive otherwise-green
          # runs); a plain retry would re-link whatever partial objects the
          # first attempt left behind and fail the same way, so wipe them.
          # A real compile error fails both attempts and still fails the job.
          build_all || {
            echo "::warning::lake build failed — cleaning and retrying once"
            lake clean
            build_all
          }

      - name: Run pure safety tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-results
          git rev-parse HEAD > ci-results/tested-sha.txt
          timeout --kill-after=10 120 flare_operator/.lake/build/bin/flare_unit 2>&1 | tee ci-results/flare-unit.log

      - name: Create kind cluster
        run: kind create cluster --name flare-e2e --wait 120s

      - name: Build Docker images
        run: |
          docker build -t flare-operator:test -f Dockerfile.operator .
          docker build -t flare-node:test -f Dockerfile.flare-node .
          docker build -t flare-node-rocksdb:test -f Dockerfile.flare-node-rocksdb .

      - name: Load images into kind
        run: |
          kind load docker-image flare-operator:test --name flare-e2e
          kind load docker-image flare-node:test --name flare-e2e
          kind load docker-image flare-node-rocksdb:test --name flare-e2e

      - name: Create namespace
        run: kubectl create namespace flare-system --dry-run=client -o yaml | kubectl apply -f -

      # Single source of truth: CRD, RBAC (ClusterRole `flare-operator`,
      # which the per-suite operators' ClusterRoleBindings reference) and
      # the flare-system operator all come from the helm chart. There is no
      # second hand-maintained manifest to drift — the readiness-probe and
      # nodes-RBAC bugs were both drift between the chart and a deploy/*.yaml
      # copy. `helm template | kubectl apply` (not `helm install`) keeps it
      # deterministic and side-effect-free in CI. fullnameOverride pins every
      # name to `flare-operator` so the per-suite bindings still resolve.
      - name: Deploy operator (helm chart)
        run: |
          helm template flare helm/flare-operator \
            --namespace flare-system \
            --set fullnameOverride=flare-operator \
            --set image.repository=flare-operator \
            --set image.tag=test \
            --set image.pullPolicy=Never \
            --set cluster.enabled=false \
            --include-crds \
            | kubectl apply -f -
          kubectl wait --for=condition=Established \
            crd/flareclusters.flare.gree.net --timeout=60s

      - name: Wait for operator ready
        run: |
          # bash -e used to abort before the diagnostics on rollout
          # timeout — dump everything unconditionally, THEN fail.
          if ! kubectl rollout status deployment/flare-operator -n flare-system --timeout=300s; then
            echo "=== ROLLOUT TIMED OUT — diagnostics ==="
            kubectl get pods -n flare-system -o wide
            kubectl describe deployment/flare-operator -n flare-system | tail -20
            for p in $(kubectl get pods -n flare-system -o name); do
              echo "=== describe $p (events) ==="
              kubectl describe "$p" -n flare-system | grep -A12 "^Events:"
              echo "=== logs $p ==="
              kubectl logs "$p" -n flare-system --tail=60 || true
            done
            kubectl get events -n flare-system --sort-by=.lastTimestamp | tail -20
            exit 1
          fi
          echo "=== Operator pods ==="
          kubectl get pods -n flare-system
          echo "=== Operator logs (initial) ==="
          kubectl logs -n flare-system -l app=flare-operator --tail=50

      - name: Run E2E tests (${{ matrix.group }})
        shell: bash
        env:
          EVALUATION: ${{ inputs.evaluation || 'none' }}
          SUITE_GROUP: ${{ matrix.group }}
          SUITES: ${{ matrix.suites }}
        run: |
          set -euo pipefail
          mkdir -p ci-results
          git rev-parse HEAD > ci-results/tested-sha.txt
          echo "$EVALUATION" > ci-results/evaluation.txt
          cd flare_operator
          export KUBECONFIG=$HOME/.kube/config
          # timeout(1) produces "exit code 124" on expiry — this inner limit
          # is what kills a leg, not timeout-minutes. 75 min per SHARDED leg
          # (longest group ~45 min measured + slack).
          limit=4500
          if [ "$SUITE_GROUP" = continuous-replication ]; then
            case "$EVALUATION" in
              sustained) export FLARE_E2E_SUSTAINED=1; limit=10800 ;;
              scale-2m) export FLARE_E2E_SCALE_KEYS=2000000; limit=10800 ;;
              scale-15m8) export FLARE_E2E_SCALE_KEYS=15800000; limit=10800 ;;
              none) ;;
              *) echo "Unknown evaluation profile"; exit 1 ;;
            esac
          fi
          timeout --kill-after=30 "$limit" .lake/build/bin/flare_e2e --filter "$SUITES" 2>&1 | tee ../ci-results/e2e.log

      - name: Preserve tested revision and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.group }}-${{ inputs.evaluation || 'none' }}-${{ github.run_attempt }}
          path: ci-results/
          retention-days: 30

      - name: Verify every suite is assigned to a shard
        run: |
          cd flare_operator
          # Union of the matrix groups must equal --list, or a new suite
          # silently never runs. Kept in ONE place here; compare as sets.
          ALL_GROUPS="failover,read-balance,scale-out-master,scale-out-slave,scale-in-slave,scale-in-master,replace-nodes,cluster-replication,partition-reduction,wal-retention-config,strict-durability,snapshot-push-seed,wal-bandwidth-throttle,wal-incremental-sync,wal-purged-fallback,resync-failure-self-demote,orphan-scan-purge,terminating-pod-handling,failover-during-replication,data-survival-failover,pvc-data-survival,backup-restore,circuit-breaker,operator-restart,topology-authority,replica-repair,prepare-evidence,native-metrics,blue-green-migration,continuous-replication,continuous-replication-purge,continuous-replication-limits,continuous-replication-scale,continuous-replication-sustained"
          LISTED=$(.lake/build/bin/flare_e2e --list | sed -n 's/^  \([a-z0-9-]*\) (.*/\1/p' | sort)
          GROUPED=$(echo "$ALL_GROUPS" | tr ',' '\n' | sort)
          if ! diff <(echo "$LISTED") <(echo "$GROUPED"); then
            echo "::error::suite list and shard groups have drifted — update the matrix in e2e-tests.yaml"
            exit 1
          fi

      - name: Dump operator logs on failure
        if: failure()
        run: |
          # Suites run their own operator in per-suite namespaces (flare-*),
          # so dump every one of them — a fixed -n flare-system misses the
          # namespace of the suite that actually failed.
          for ns in $(kubectl get ns -o name | sed 's|namespace/||' | grep '^flare-'); do
            echo "=== Operator Logs ($ns) ==="
            kubectl logs -n "$ns" -l app=flare-operator --tail=300 --prefix || true
            echo "=== flared Logs ($ns, tail 100 each) ==="
            kubectl logs -n "$ns" -l app=flare --tail=100 --prefix || true
          done

      - name: Dump K8s state on failure
        if: failure()
        run: |
          echo "=== All Namespaces ==="
          kubectl get ns || true
          echo ""
          echo "=== All Pods ==="
          kubectl get pods --all-namespaces || true
          echo ""
          echo "=== Events (all namespaces) ==="
          kubectl get events --all-namespaces --sort-by='.lastTimestamp' || true
          echo ""
          echo "=== FlareCluster CRs ==="
          kubectl get flareclusters --all-namespaces -o yaml || true

      - name: Delete kind cluster
        if: always()
        run: kind delete cluster --name flare-e2e
