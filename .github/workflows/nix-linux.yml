name: nix-linux

on:
  # push builds only master; feature branches build via their PRs (dedup).
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: nix-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test-legacy:
    name: Test Legacy Build (without RocksDB)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v3
      - uses: cachix/install-nix-action@v22
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Build and test legacy Flare
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-results
          git rev-parse HEAD > ci-results/tested-sha.txt
          timeout --kill-after=30 3000 nix build .#test-flare -L 2>&1 | tee ci-results/nix.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nix-legacy-${{ github.run_attempt }}
          path: ci-results/
          retention-days: 30
      - name: Verify RocksDB is NOT compiled
        run: |
          nix build .#flare -L
          if nm result/bin/flared | grep -q rocksdb; then
            echo "ERROR: RocksDB symbols found in legacy build"
            exit 1
          fi
          echo "SUCCESS: Legacy build has no RocksDB dependencies"

  test-rocksdb:
    name: Test RocksDB Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v3
      - uses: cachix/install-nix-action@v22
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Build and test Flare with RocksDB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-results
          git rev-parse HEAD > ci-results/tested-sha.txt
          timeout --kill-after=30 3000 nix build .#test-flare-rocksdb -L 2>&1 | tee ci-results/nix.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nix-rocksdb-${{ github.run_attempt }}
          path: ci-results/
          retention-days: 30
      - name: Verify RocksDB is compiled
        run: |
          nix build .#flare-rocksdb -L
          if ! nm result/bin/flared | grep -q rocksdb; then
            echo "ERROR: RocksDB symbols NOT found in RocksDB build"
            exit 1
          fi
          echo "SUCCESS: RocksDB build has RocksDB dependencies"
