name: nix-linux

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-legacy:
    name: Test Legacy Build (without RocksDB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: cachix/install-nix-action@v22
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Build and test legacy Flare
        # The repartition test in flare-tests is statistical (random key
        # distribution, fails when deviation >= 0.3), so retry up to 3 times.
        run: |
          for i in 1 2 3; do
            nix build .#test-flare -L && exit 0 || echo "attempt $i failed"
          done
          exit 1
      - name: Verify RocksDB is NOT compiled
        run: |
          nix build .#flare -L
          if nm result/bin/flared | grep -q rocksdb; then
            echo "ERROR: RocksDB symbols found in legacy build"
            exit 1
          fi
          echo "SUCCESS: Legacy build has no RocksDB dependencies"

  test-rocksdb:
    name: Test RocksDB Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: cachix/install-nix-action@v22
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Build and test Flare with RocksDB
        # Same statistical repartition test as the legacy job; retry up to 3 times.
        run: |
          for i in 1 2 3; do
            nix build .#test-flare-rocksdb -L && exit 0 || echo "attempt $i failed"
          done
          exit 1
      - name: Verify RocksDB is compiled
        run: |
          nix build .#flare-rocksdb -L
          if ! nm result/bin/flared | grep -q rocksdb; then
            echo "ERROR: RocksDB symbols NOT found in RocksDB build"
            exit 1
          fi
          echo "SUCCESS: RocksDB build has RocksDB dependencies"
