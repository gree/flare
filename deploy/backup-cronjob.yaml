# Periodic flare backup via the flared `backup` op (RocksDB checkpoint).
#
# ONE CronJob running ONE strictly-ordered script (`flare-backup-run`, baked
# into the flare-backup image):
#
#   per partition (one Active node of BACKUP_ROLE — replicas hold identical
#   data, so backing up every pod is redundant):
#     1. fresh local checkpoint (hard-linked, near-instant, survives
#        flush_all; local generations pruned by flared's rocksdb-backup-keep)
#     2. pull it out of the pod
#     3. RESTORE-CONSISTENT 3-phase upload to <bucket>/<cluster>/latest/p<N>/
#        (keyed by partition, stable across failover)
#     4. verify CURRENT -> MANIFEST in the bucket
#   once per UTC day (first successful run):
#     5. server-side copy latest/ -> snapshots/<YYYYMMDD>/ (+ verify)
#     6. prune generations older than KEEP_DAYS
#
# Everything runs in one process, in order — a separate daily CronJob could
# race a running delta (its recursive copy lists a MANIFEST that the delta's
# prune phase then deletes -> torn snapshot). Self-overlap is prevented by
# concurrencyPolicy: Forbid + activeDeadlineSeconds BELOW the cadence (a hung
# run is killed before its next slot instead of blocking it forever).
#
# RPO = the schedule interval (writes since the last run are the exposure).
# Tighten toward */5 as needed — every run is a delta upload. NOTE: keep the
# cluster's rocksdb WAL retention (walTtlSeconds) comfortably ABOVE this
# interval + backupBootstrap.maxAgeSeconds, or a backup-seeded pod can never
# catch up via WAL incremental sync (its cursor is already purged on the
# master) and always degrades to a full dump.
#
# Object storage is S3-compatible: for a non-AWS store (COS, GCS, MinIO, …)
# set S3_ENDPOINT. Vendor endpoints, buckets, and credentials are
# DEPLOYMENT-side (a Secret + these env values), never committed here.
#
# Restore procedure: see docs/BACKUP_RESTORE.md.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: flare-backup
  namespace: flare-system
spec:
  schedule: "0 * * * *"          # hourly; every run is a delta
  concurrencyPolicy: Forbid      # never two runners at once
  # If a slot was skipped (previous run still active / controller hiccup),
  # start up to 15 min late rather than not at all.
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  suspend: true                  # enable after configuring bucket + credentials
  jobTemplate:
    spec:
      # HARD timeout, kept BELOW the hourly cadence: a hung run (stuck
      # kubectl cp, stalled upload) dies before its next slot.
      activeDeadlineSeconds: 3300
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: flare-backup   # needs pods/get + pods/exec
          containers:
            - name: backup
              # kubectl + aws-cli v2 + the runner script baked in
              # (deploy/backup-scripts/); pin to your release tag.
              image: ghcr.io/gree/flare-backup:latest
              envFrom:
                - secretRef:
                    name: flare-backup-s3-credentials
              env:
                - name: CLUSTER
                  value: "default"
                - name: NAMESPACE
                  value: "flare-system"
                - name: FLARE_PORT
                  value: "12121"
                # master=freshest copy; slave=offloads the master.
                - name: BACKUP_ROLE
                  value: "master"            # master | slave
                - name: OPERATOR_SVC         # operator svc ({release}-flare-operator)
                  value: "flare-flare-operator.flare-system.svc.cluster.local"
                - name: OPERATOR_PORT
                  value: "12120"
                - name: BUCKET            # s3://bucket/prefix (no trailing slash)
                  value: "s3://YOUR-BUCKET/flare-backups"
                - name: S3_ENDPOINT       # e.g. an S3-compatible endpoint; empty for AWS
                  value: ""
                - name: DATA_DIR
                  value: "/data/flare"
                - name: KEEP_DAYS         # retained daily generations; 0 disables them
                  value: "14"
              command: ["flare-backup-run"]
