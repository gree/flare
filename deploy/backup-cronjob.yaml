# Periodic flare backup via the flared `backup` op (RocksDB checkpoint).
#
# Three tiers, each an independent CronJob you enable/schedule to taste:
#
#   Tier 1  flare-backup            local RocksDB checkpoint on each pod's PVC.
#                                    Hard-linked, near-instant, survives
#                                    flush_all. Retention: flared's
#                                    `rocksdb-backup-keep` (default 7).
#
#   Tier 2a flare-backup-s3-delta   frequent DELTA upload to object storage.
#                                    Backs up ONE node per partition (the master,
#                                    or a slave via BACKUP_ROLE — replicas hold
#                                    identical data) and mirrors its newest
#                                    checkpoint to <bucket>/<cluster>/latest/p<N>/
#                                    (keyed by partition, stable across failover)
#                                    with `aws s3 sync --size-only --delete`. RocksDB
#                                    SSTs are immutable and uniquely named, so
#                                    --size-only uploads only NEW SSTs (+ the
#                                    small changed MANIFEST/CURRENT) and --delete
#                                    prunes SSTs dropped by compaction. Every run
#                                    is a delta; the WAN transfer is just the
#                                    write delta since the previous run.
#
#   Tier 2b flare-backup-s3-daily   once-a-day FULL retained snapshot. A pure
#                                    server-side copy of <cluster>/latest/ ->
#                                    <cluster>/snapshots/<date>/
#                                    inside the bucket (no cluster egress), plus
#                                    pruning of snapshots older than KEEP_DAYS.
#                                    Gives point-in-time rollback; the delta job
#                                    only keeps the single most-recent state.
#
# RPO = the tier-2a interval (writes since the last delta are the exposure).
# Object storage is S3-compatible: for a non-AWS S3-compatible store (GCS,
# MinIO, …) set S3_ENDPOINT to that store's endpoint. Vendor endpoints,
# buckets, and credentials are DEPLOYMENT-side (a Secret + these env values),
# never committed here.
#
# Restore procedure: see docs/BACKUP_RESTORE.md.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: flare-backup
  namespace: flare-system
spec:
  schedule: "0 3 * * *"          # daily 03:00 UTC (local checkpoints)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: trigger
              image: busybox:1.36
              env:
                - name: CLUSTER
                  value: "default"           # FlareCluster name
                - name: NAMESPACE
                  value: "flare-system"
                - name: FLARE_PORT
                  value: "12121"
                # Back up ONE node per partition, not every replica (replicas hold
                # identical data — backing up all of them is redundant). BACKUP_ROLE
                # picks which copy: master (freshest) or slave (offloads the master).
                # Targets are discovered from the operator's node map, so this tracks
                # failover automatically (no static NUM_PODS / pod-index assumptions).
                - name: BACKUP_ROLE
                  value: "master"            # master | slave
                - name: OPERATOR_SVC         # operator flarei svc ({release}-flare-operator)
                  value: "flare-flare-operator.flare-system.svc.cluster.local"
                - name: OPERATOR_PORT
                  value: "12120"
              command:
                - sh
                - -c
                - |
                  set -e
                  # Discover targets from the operator node map: one pod per partition
                  # with the chosen role (role code: master=0, slave=1).
                  RC=0; [ "$BACKUP_ROLE" = "slave" ] && RC=1
                  # NODE <name> <port> <role> <state> <partition> ...; role master=0
                  # slave=1, state Active=0. One Active node per partition ($6).
                  TARGETS=$(printf 'node sync\r\n' | nc -w 5 "$OPERATOR_SVC" "$OPERATOR_PORT" \
                    | awk -v rc="$RC" '/^NODE/ && $4==rc && $5==0 { part=$6; if (!(part in s)) { s[part]=1; split($2,a,"."); print a[1] } }')
                  [ -z "$TARGETS" ] && { echo "no backup targets for role=$BACKUP_ROLE via node sync"; exit 1; }
                  STAMP=$(date -u +%Y%m%d-%H%M%S)
                  FAIL=0
                  for POD in $TARGETS; do
                    HOST="${POD}.${CLUSTER}-nodes.${NAMESPACE}.svc.cluster.local"
                    echo "backing up ${POD} (role=$BACKUP_ROLE) -> ${STAMP}"
                    REPLY=$(printf 'backup %s\r\n' "$STAMP" | nc -w 30 "$HOST" "$FLARE_PORT" || true)
                    echo "  reply: ${REPLY}"
                    case "$REPLY" in
                      *ERROR*|"") echo "  BACKUP FAILED on ${POD}"; FAIL=1 ;;
                    esac
                  done
                  exit "$FAIL"
---
# Tier 2a: frequent DELTA upload to object storage (S3 / COS / GCS / MinIO).
# Each run picks ONE node per partition (BACKUP_ROLE, discovered from the operator
# node map), takes a fresh checkpoint, copies it out, and mirrors it to
# <bucket>/<cluster>/latest/p<N>/ with `aws s3 sync --size-only --delete` so
# only newly-flushed SSTs cross the WAN. Requires:
#   - a ServiceAccount bound to a Role allowing pods/get + pods/exec
#   - an image with BOTH kubectl and aws-cli
#   - a Secret `flare-backup-s3-credentials` with AWS_ACCESS_KEY_ID /
#     AWS_SECRET_ACCESS_KEY (or IRSA/workload-identity — then drop envFrom)
# For a non-AWS S3-compatible store set S3_ENDPOINT to that store's endpoint.
# NOTE ON CADENCE: this job pulls each pod's checkpoint intra-cluster before the
# delta upload, so at minute-cadence on a large dataset the intra-cluster copy
# dominates. For true minute-level RPO on big data, run aws-cli as a sidecar in
# the flared pod (PVC mounted read-only) and `sync` the checkpoint dir in place,
# skipping the pull entirely. Hourly (the default here) is fine job-based.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: flare-backup-s3-delta
  namespace: flare-system
spec:
  schedule: "0 * * * *"          # hourly delta (tighten toward */5 or */1 as needed)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  suspend: true                  # enable after configuring bucket + credentials
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: flare-backup   # needs pods/get + pods/exec
          containers:
            - name: upload
              # Image needs kubectl AND aws-cli (build a small combined image;
              # amazon/aws-cli alone has no kubectl).
              image: YOUR-REGISTRY/kubectl-awscli:latest
              envFrom:
                - secretRef:
                    name: flare-backup-s3-credentials
              env:
                - name: CLUSTER
                  value: "default"
                - name: NAMESPACE
                  value: "flare-system"
                - name: FLARE_PORT
                  value: "12121"
                # Back up ONE node per partition (not every replica). master=freshest,
                # slave=offloads the master. Targets discovered from the operator.
                - name: BACKUP_ROLE
                  value: "master"            # master | slave
                - name: OPERATOR_SVC         # operator flarei svc ({release}-flare-operator)
                  value: "flare-flare-operator.flare-system.svc.cluster.local"
                - name: OPERATOR_PORT
                  value: "12120"
                - name: BUCKET            # s3://bucket/prefix (no trailing slash)
                  value: "s3://YOUR-BUCKET/flare-backups"
                - name: S3_ENDPOINT       # e.g. COS S3-compatible endpoint; empty for AWS
                  value: ""
                - name: DATA_DIR
                  value: "/data/flare"
              command:
                - sh
                - -c
                - |
                  set -e
                  EP=""; [ -n "$S3_ENDPOINT" ] && EP="--endpoint-url $S3_ENDPOINT"
                  # One target pod per partition of the chosen role (master=0, slave=1),
                  # discovered from the operator node map — no redundant per-replica
                  # backups. Emit "<pod>:<partition>".
                  RC=0; [ "$BACKUP_ROLE" = "slave" ] && RC=1
                  # NODE <name> <port> <role> <state> <partition> ...; pick one Active
                  # ($5==0) node of the role per partition ($6). Emit "<pod>:<partition>".
                  TARGETS=$(printf 'node sync\r\n' | nc -w 5 "$OPERATOR_SVC" "$OPERATOR_PORT" \
                    | awk -v rc="$RC" '/^NODE/ && $4==rc && $5==0 { part=$6; if (!(part in s)) { s[part]=1; split($2,a,"."); print a[1]":"part } }')
                  [ -z "$TARGETS" ] && { echo "no backup targets for role=$BACKUP_ROLE via node sync"; exit 1; }
                  FAIL=0
                  for T in $TARGETS; do
                    POD="${T%%:*}"; PART="${T##*:}"
                    HOST="${POD}.${CLUSTER}-nodes.${NAMESPACE}.svc.cluster.local"
                    STAMP=$(date -u +%Y%m%d-%H%M%S)
                    # Generation-first layout: <cluster>/latest/p<N>/ (the daily job
                    # snapshots it to <cluster>/snapshots/<date>/p<N>/). Keyed by
                    # PARTITION so a master change keeps a stable path.
                    DST="${BUCKET}/${CLUSTER}/latest/p${PART}"
                    # 1) fresh consistent checkpoint (hard-links; near-instant)
                    REPLY=$(printf 'backup %s\r\n' "$STAMP" | nc -w 30 "$HOST" "$FLARE_PORT" || true)
                    case "$REPLY" in *ERROR*|"") echo "checkpoint FAILED on ${POD}"; FAIL=1; continue ;; esac
                    # 2) copy the checkpoint out of the pod (intra-cluster)
                    rm -rf "/tmp/${POD}"; mkdir -p "/tmp/${POD}"
                    kubectl cp -n "$NAMESPACE" "${POD}:${DATA_DIR}/backups/${STAMP}" "/tmp/${POD}"
                    # 3) DELTA upload: --size-only skips immutable SSTs already
                    #    present; --delete prunes compaction leftovers. Result is
                    #    a complete, current mirror at <bucket>/<cluster>/latest/p<N>/.
                    #    (For the CURRENT-pointer restore hazard under --size-only, see
                    #    the 3-phase upload + verify in the OIDC variant.)
                    aws s3 sync "/tmp/${POD}" "${DST}/" --size-only --delete $EP || FAIL=1
                    rm -rf "/tmp/${POD}"
                    # 4) local checkpoint retention is flared's job (rocksdb-backup-keep)
                  done
                  exit "$FAIL"
---
# Tier 2b: once-a-day FULL retained snapshot, entirely server-side (no cluster
# egress) — copies the current mirror to a dated prefix and prunes old ones.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: flare-backup-s3-daily
  namespace: flare-system
spec:
  schedule: "0 3 * * *"          # daily 03:00 UTC (independent of the delta job)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  suspend: true                  # enable after configuring bucket + credentials
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: snapshot
              image: amazon/aws-cli:2.15.0
              envFrom:
                - secretRef:
                    name: flare-backup-s3-credentials
              env:
                - name: CLUSTER
                  value: "default"
                - name: BUCKET
                  value: "s3://YOUR-BUCKET/flare-backups"
                - name: S3_ENDPOINT
                  value: ""
                - name: KEEP_DAYS
                  value: "14"
              command:
                - sh
                - -c
                - |
                  set -e
                  EP=""; [ -n "$S3_ENDPOINT" ] && EP="--endpoint-url $S3_ENDPOINT"
                  DATE=$(date -u +%Y%m%d)
                  # Generation-first layout: snapshot the whole current mirror
                  # (<cluster>/latest/p<N>/) into a dated, retained generation
                  # (<cluster>/snapshots/<date>/p<N>/). Server-side copy within the
                  # bucket (COS/S3) — no cluster egress.
                  aws s3 cp --recursive $EP \
                    "${BUCKET}/${CLUSTER}/latest/" \
                    "${BUCKET}/${CLUSTER}/snapshots/${DATE}/"
                  # Prune snapshot generations older than KEEP_DAYS (compare YYYYMMDD).
                  CUTOFF=$(date -u -d "-${KEEP_DAYS} days" +%Y%m%d 2>/dev/null || date -u -v-${KEEP_DAYS}d +%Y%m%d)
                  for d in $(aws s3 ls $EP "${BUCKET}/${CLUSTER}/snapshots/" | awk '{print $2}' | tr -d '/'); do
                    case "$d" in ''|*[!0-9]*) continue ;; esac
                    if [ "$d" -lt "$CUTOFF" ]; then
                      echo "pruning old snapshot ${d}"
                      aws s3 rm --recursive $EP "${BUCKET}/${CLUSTER}/snapshots/${d}/"
                    fi
                  done
