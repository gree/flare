apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: flareclusters.flare.gree.net
spec:
  group: flare.gree.net
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - partitions
                - replicas
              properties:
                partitions:
                  type: integer
                  minimum: 1
                  description: Number of data partitions
                replicas:
                  type: integer
                  minimum: 1
                  description: "Replication factor (1 = master only, 2 = master + 1 slave, etc.)"
                clusterReplication:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    serverName:
                      type: string
                      description: Destination cluster service FQDN
                    port:
                      type: integer
                      description: Destination flared port
                    mode:
                      type: string
                      enum: [duplicate, forward]
                      default: duplicate
                    concurrency:
                      type: integer
                      default: 2
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Running, Degraded, Error]
                nodeMapVersion:
                  type: integer
                readyNodes:
                  type: integer
                totalNodes:
                  type: integer
                migrationPhase:
                  type: string
                  enum: [None, Dumping, Forwarding]
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Partitions
          type: integer
          jsonPath: .spec.partitions
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Ready
          type: integer
          jsonPath: .status.readyNodes
        - name: Migration
          type: string
          jsonPath: .status.migrationPhase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
  scope: Namespaced
  names:
    plural: flareclusters
    singular: flarecluster
    kind: FlareCluster
    shortNames:
      - fc
