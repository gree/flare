apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: flareclusters.flare.gree.net
spec:
  group: flare.gree.net
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - partitions
                - replicas
              properties:
                partitions:
                  type: integer
                  minimum: 1
                  description: Number of data partitions
                replicas:
                  type: integer
                  minimum: 1
                  description: "Replication factor (1 = master only, 2 = master + 1 slave, etc.)"
                clusterReplication:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    serverName:
                      type: string
                      description: Destination cluster service FQDN
                    port:
                      type: integer
                      description: Destination flared port
                    mode:
                      type: string
                      enum: [duplicate, forward]
                      default: duplicate
                    concurrency:
                      type: integer
                      default: 2
                rocksdb:
                  type: object
                  description: >-
                    RocksDB storage backend tuning. Fields map 1:1 to flared's
                    rocksdb-* ini options and are only emitted into the
                    cluster ConfigMap when explicitly set. See
                    ROCKSDB_REPLICATION.md for semantics.
                  properties:
                    walTtlSeconds:
                      type: integer
                      minimum: 0
                      description: WAL retention time in seconds (rocksdb-wal-ttl-seconds)
                    walSizeLimitMb:
                      type: integer
                      minimum: 0
                      description: WAL size cap in megabytes (rocksdb-wal-size-limit-mb)
                    syncWrites:
                      type: boolean
                      description: Force sync=true on every write (rocksdb-sync-writes)
                    resyncFailureThreshold:
                      type: integer
                      minimum: 1
                      description: Consecutive resync failures before self-demote
                    walMaxBatchBytes:
                      type: integer
                      minimum: 0
                      description: Per-WriteBatch size ceiling for WAL replication
                    walSyncBwlimit:
                      type: integer
                      minimum: 0
                      description: Bandwidth cap (KB/s) for WAL-sync streaming
                    walSyncInterval:
                      type: integer
                      minimum: 0
                      description: Inter-batch delay (usec) for WAL-sync streaming
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Running, Degraded, Error]
                nodeMapVersion:
                  type: integer
                readyNodes:
                  type: integer
                totalNodes:
                  type: integer
                migrationPhase:
                  type: string
                  enum: [None, Dumping, Forwarding]
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Partitions
          type: integer
          jsonPath: .spec.partitions
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Ready
          type: integer
          jsonPath: .status.readyNodes
        - name: Migration
          type: string
          jsonPath: .status.migrationPhase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
  scope: Namespaced
  names:
    plural: flareclusters
    singular: flarecluster
    kind: FlareCluster
    shortNames:
      - fc
