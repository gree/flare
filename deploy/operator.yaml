apiVersion: v1
kind: Namespace
metadata:
  name: flare-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flare-operator
  namespace: flare-system
  labels:
    app: flare-operator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flare-operator
  template:
    metadata:
      labels:
        app: flare-operator
    spec:
      serviceAccountName: flare-operator
      containers:
        - name: flare-operator
          image: flare-operator:test
          imagePullPolicy: IfNotPresent
          args:
            - "--namespace"
            - "flare-system"
          env:
            - name: FLARE_CLUSTER_NAME
              value: "default"
            - name: FLARE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - containerPort: 12120
              name: flare-index
              protocol: TCP
            - containerPort: 8080
              name: health
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # Must match the helm chart: probe the health server (8080), not
          # the index port (12120). Since the leader-label change only the
          # leader binds 12120, so a tcpSocket:12120 readiness left every
          # standby 0/1 forever and this replicas:2 rollout never completed
          # — this CI manifest had drifted from the chart (same class as
          # the RBAC drift). Under the leader-label design /readyz is 200 on
          # BOTH the leader and a healthy standby (readiness means "able to
          # take the lease", routing is by pod label), so the deployment
          # reaches 2/2; /healthz is 200 on any live pod.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: flare-operator
  namespace: flare-system
  labels:
    app: flare-operator
spec:
  selector:
    app: flare-operator
  ports:
    - port: 12120
      targetPort: flare-index
      protocol: TCP
      name: flare-index
  type: ClusterIP
