apiVersion: v1
kind: Namespace
metadata:
  name: flare-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flare-operator
  namespace: flare-system
  labels:
    app: flare-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flare-operator
  template:
    metadata:
      labels:
        app: flare-operator
    spec:
      serviceAccountName: flare-operator
      containers:
        - name: flare-operator
          image: flare-operator:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: FLARE_CLUSTER_NAME
              value: "default"
            - name: FLARE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - containerPort: 12120
              name: flare-index
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            tcpSocket:
              port: flare-index
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: flare-index
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: flare-operator
  namespace: flare-system
  labels:
    app: flare-operator
spec:
  selector:
    app: flare-operator
  ports:
    - port: 12120
      targetPort: flare-index
      protocol: TCP
      name: flare-index
  type: ClusterIP
