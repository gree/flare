apiVersion: v1
kind: ServiceAccount
metadata:
  name: flare-operator
  namespace: flare-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: flare-operator
rules:
  # FlareCluster CRD
  - apiGroups: ["flare.gree.net"]
    resources: ["flareclusters", "flareclusters/status"]
    verbs: ["get", "list", "watch", "update", "patch"]
  # Pods (list flared pods, delete dead pods)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  # Services (patch selectors for routing)
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # ConfigMaps (observability / node-map)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Events (emit K8s events for operator actions)
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flare-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flare-operator
subjects:
  - kind: ServiceAccount
    name: flare-operator
    namespace: flare-system
