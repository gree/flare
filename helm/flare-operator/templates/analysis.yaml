{{- /* OFFLINE keyspace analysis CronJob (monthly by default). Runs entirely
       against the S3 BACKUP checkpoint — never touches the serving cluster.

       IMPORTANT sizing: RocksDB can only open a checkpoint from a LOCAL
       filesystem, so the pull stages the ENTIRE dataset (SST + blob files) to
       the work volume — that is larger than the CSV output. Size the work
       volume for the whole dataset: set analysis.workVolumeClaimName to a PVC
       for big clusters; the default emptyDir uses node ephemeral disk (NOT
       memory).

       The OUTPUT is streamed to object storage, never staged: the analyze
       container (flared image) gzips `flared --analyze-checkpoint` into a
       per-partition FIFO on the shared volume, and the upload container
       (flare-backup image, aws-cli) reads that FIFO straight into
       `aws s3 cp -` (multipart from stdin). Constant memory + constant output
       disk regardless of keyspace size. The two run CONCURRENTLY and rendezvous
       per partition on the FIFO. */}}
{{- if .Values.cluster.enabled }}
{{- $c := .Values.cluster }}
{{- $ns := .Values.namespace }}
{{- $an := dict "enabled" false }}
{{- if $c.analysis }}{{- $an = $c.analysis }}{{- end }}
{{- if $an.enabled }}
{{- $os := $c.objectStorage | default dict }}
{{- if not $os.url }}{{- fail "cluster.analysis requires cluster.objectStorage.url" }}{{- end }}
{{- $bk := $c.backup | default dict }}
{{- $bsa := $bk.serviceAccount | default dict }}
{{- $saName := $bsa.name | default (printf "%s-backup" $c.name) }}
{{- $anImg := $an.image | default dict }}
{{- $anRepo := $anImg.repository | default $c.image.repository }}
{{- $anTag := $anImg.tag | default $c.image.tag }}
{{- $bkImg := $bk.image | default dict }}
{{- $bkRepo := $bkImg.repository | default "ghcr.io/gree/flare-backup" }}
{{- $bkTag := $bkImg.tag | default $c.image.tag }}
{{- $ep := $os.endpoint | default "" }}
{{- $pmax := sub (int $c.partitions) 1 }}
{{- /* hasKey, not `| default`: sprig's default treats false as empty and
       would flip an explicit uploadReport:false back to true. */}}
{{- $upload := true }}
{{- if hasKey $an "uploadReport" }}{{- $upload = $an.uploadReport }}{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $c.name }}-analysis
  namespace: {{ $ns }}
  labels:
    {{- include "flare-operator.clusterLabel" . | nindent 4 }}
    {{- include "flare-operator.wellKnown" (dict "root" $ "name" "flared" "component" "analysis") | nindent 4 }}
spec:
  schedule: {{ $an.schedule | default "0 4 1 * *" | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  suspend: {{ $an.suspend | default false }}
  jobTemplate:
    spec:
      activeDeadlineSeconds: {{ $an.activeDeadlineSeconds | default 21600 }}
      template:
        metadata:
          labels:
            app: flare-analysis
            cluster: {{ $c.name }}
            {{- include "flare-operator.clusterLabel" . | nindent 12 }}
            {{- include "flare-operator.wellKnown" (dict "root" $ "name" "flared" "component" "analysis") | nindent 12 }}
            {{- with $c.podLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ $saName }}
          volumes:
            - name: work
              {{- if $an.workVolumeClaimName }}
              persistentVolumeClaim:
                claimName: {{ $an.workVolumeClaimName }}
              {{- else }}
              emptyDir: {}   # node ephemeral disk — must fit the whole dataset
              {{- end }}
            {{- if $os.projectedTokenAudience }}
            - name: token
              projected:
                sources:
                  - serviceAccountToken:
                      audience: {{ $os.projectedTokenAudience }}
                      expirationSeconds: 3600
                      path: token
            {{- end }}
          initContainers:
            # Stage each partition's checkpoint locally (RocksDB needs local
            # files) and create the per-partition output FIFO.
            - name: pull
              image: "{{ $bkRepo }}:{{ $bkTag }}"
              imagePullPolicy: {{ $c.image.pullPolicy }}
              {{- if $os.credentialsSecret }}
              envFrom:
                - secretRef:
                    name: {{ $os.credentialsSecret }}
              {{- end }}
              volumeMounts:
                - name: work
                  mountPath: /work
                {{- if $os.projectedTokenAudience }}
                - name: token
                  mountPath: /var/run/secrets/sts
                  readOnly: true
                {{- end }}
              {{- with $os.extraEnv }}
              env:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              command:
                - sh
                - -c
                - |
                  set -e
                  EP=""; [ -n "{{ $ep }}" ] && EP="--endpoint-url {{ $ep }}"
                  for p in $(seq 0 {{ $pmax }}); do
                    mkdir -p /work/p$p
                    aws s3 sync {{ $os.url }}/{{ $c.name }}/latest/p$p /work/p$p --no-progress $EP
                    {{- if $upload }}
                    rm -f /work/fifo$p; mkfifo /work/fifo$p
                    {{- end }}
                  done
          containers:
            # Producer: stream key,expire,ttl,size CSV per partition. With
            # uploadReport, gzip into the FIFO the upload container drains to
            # S3; otherwise discard the body and keep only the log summary.
            - name: analyze
              image: "{{ $anRepo }}:{{ $anTag }}"
              imagePullPolicy: {{ $c.image.pullPolicy }}
              volumeMounts:
                - name: work
                  mountPath: /work
              command:
                - bash
                - -c
                - |
                  set -eo pipefail
                  for p in $(seq 0 {{ $pmax }}); do
                    echo "== analyzing p$p =="
                    {{- if $upload }}
                    flared --analyze-checkpoint /work/p$p | gzip > /work/fifo$p
                    {{- else }}
                    flared --analyze-checkpoint /work/p$p | gzip | wc -c
                    {{- end }}
                  done
            {{- if $upload }}
            # Consumer: drain each FIFO straight into a multipart S3 upload —
            # the CSV is never staged on disk.
            - name: upload
              image: "{{ $bkRepo }}:{{ $bkTag }}"
              imagePullPolicy: {{ $c.image.pullPolicy }}
              {{- if $os.credentialsSecret }}
              envFrom:
                - secretRef:
                    name: {{ $os.credentialsSecret }}
              {{- end }}
              volumeMounts:
                - name: work
                  mountPath: /work
                {{- if $os.projectedTokenAudience }}
                - name: token
                  mountPath: /var/run/secrets/sts
                  readOnly: true
                {{- end }}
              {{- with $os.extraEnv }}
              env:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              command:
                - bash
                - -c
                - |
                  set -eo pipefail
                  EP=""; [ -n "{{ $ep }}" ] && EP="--endpoint-url {{ $ep }}"
                  DATE=$(date -u +%Y%m%d)
                  for p in $(seq 0 {{ $pmax }}); do
                    aws s3 cp - {{ $os.url }}/{{ $c.name }}/analysis/${DATE}/p$p.csv.gz --no-progress $EP < /work/fifo$p
                    echo "uploaded analysis p$p -> {{ $os.url }}/{{ $c.name }}/analysis/${DATE}/p$p.csv.gz"
                  done
            {{- end }}
{{- end }}
{{- end }}
