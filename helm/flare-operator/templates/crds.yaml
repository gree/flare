{{- /*
  FlareCluster + FlareMigration CRDs. Gated by crds.install so a dedicated
  "flare-crds" release can own them (crds.install=true, operator.enabled=false,
  cluster.enabled=false → CRDs only) while every instance app sets
  crds.install=false. Moved out of the Helm crds/ dir on purpose: crds/ is
  install-once / never-upgraded / values-blind, which cannot express single
  ownership. As templates they upgrade with the chart; the keep + Prune=false
  annotations below stop any owner’s teardown from deleting them.
  See docs/RUNBOOK.md#multi-cluster-crd-ownership. */}}
{{- if .Values.crds.install }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: flareclusters.flare.gree.net
  annotations:
    # A CRD is cluster-scoped and SHARED by every flare instance; deleting it
    # cascade-deletes ALL FlareCluster/FlareMigration CRs cluster-wide. Protect
    # it from automatic deletion so no single owner's lifecycle can take it
    # down: helm never prunes it on uninstall, ArgoCD never prunes it on sync/
    # app-deletion. Remove it deliberately (kubectl) only when retiring flare
    # from the whole cluster.
    "helm.sh/resource-policy": keep
    argocd.argoproj.io/sync-options: Prune=false
spec:
  group: flare.gree.net
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - partitions
                - replicas
              properties:
                partitions:
                  type: integer
                  minimum: 1
                  description: Number of data partitions
                replicas:
                  type: integer
                  minimum: 1
                  description: "Replication factor (1 = master only, 2 = master + 1 slave, etc.)"
                clusterReplication:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    serverName:
                      type: string
                      description: Destination cluster service FQDN
                    port:
                      type: integer
                      description: Destination flared port
                    mode:
                      type: string
                      enum: [duplicate, forward]
                      default: duplicate
                    concurrency:
                      type: integer
                      default: 2
                readBalance:
                  type: object
                  description: >-
                    Declarative read-routing policy. flared distributes reads
                    by balance weight; the operator normalizes every committed
                    node map to this policy (manual balance edits are
                    reverted — change this spec instead, applies in seconds).
                  properties:
                    master:
                      type: integer
                      default: 100
                    slave:
                      type: integer
                      default: 0
                    standby:
                      type: array
                      description: >-
                        Nodes forced to balance 0 and promoted only as a last
                        resort. Match by pod name (STS ordinal, stable) or
                        by zone.
                      items:
                        type: object
                        properties:
                          podName:
                            type: string
                          zone:
                            type: string
                rocksdb:
                  type: object
                  description: >-
                    RocksDB storage backend tuning. Fields map 1:1 to flared's
                    rocksdb-* ini options and are only emitted into the
                    cluster ConfigMap when explicitly set. See
                    ROCKSDB_REPLICATION.md for semantics.
                  properties:
                    walTtlSeconds:
                      type: integer
                      minimum: 0
                      description: WAL retention time in seconds (rocksdb-wal-ttl-seconds)
                    walSizeLimitMb:
                      type: integer
                      minimum: 0
                      description: WAL size cap in megabytes (rocksdb-wal-size-limit-mb)
                    syncWrites:
                      type: boolean
                      description: Force sync=true on every write (rocksdb-sync-writes)
                    resyncFailureThreshold:
                      type: integer
                      minimum: 1
                      description: Consecutive resync failures before self-demote
                    walMaxBatchBytes:
                      type: integer
                      minimum: 0
                      description: Per-WriteBatch size ceiling for WAL replication
                    walSyncBwlimit:
                      type: integer
                      minimum: 0
                      description: Bandwidth cap (KB/s) for WAL-sync streaming
                    walSyncInterval:
                      type: integer
                      minimum: 0
                      description: Inter-batch delay (usec) for WAL-sync streaming
                    snapshotBwlimit:
                      type: integer
                      minimum: 0
                      description: Bandwidth cap (KB/s) for serving snapshot-bootstrap streams (rocksdb-snapshot-bwlimit; sender-side, 0 = unlimited)
                    flushAllEnabled:
                      type: boolean
                      description: Administrative gate for the unauthenticated flush_all op (flared flush-all-enabled; false = refuse with SERVER_ERROR; hot-toggleable)
                    backupKeep:
                      type: integer
                      minimum: 1
                      description: >-
                        On-disk named backups (checkpoints) retained under
                        data-dir/backups/ (rocksdb-backup-keep; flared default
                        7, dynamic). On tmpfs the checkpoints live in RAM and
                        hardlink-pin compacted-away SSTs — set 1-2 there or
                        they balloon past the live DB size and OOM the pod.
                circuitBreaker:
                  type: object
                  description: >-
                    Blast-radius circuit breaker for AZ-level failures. When
                    the dead fraction reaches tripThresholdPercent the
                    operator pauses failover/reassignment; with hysteresis it
                    resumes only after the healthy fraction reaches
                    resetThresholdPercent (anti-flap: resetThresholdPercent
                    must exceed 100 - tripThresholdPercent, otherwise the
                    defaults are used).
                  properties:
                    enabled:
                      type: boolean
                      description: Enable the breaker (default true)
                    tripThresholdPercent:
                      type: integer
                      minimum: 0
                      maximum: 100
                      description: Dead-node percentage that trips the breaker (default 50)
                    resetThresholdPercent:
                      type: integer
                      minimum: 0
                      maximum: 100
                      description: Healthy percentage required to auto-reset (default 80)
                    autoResetEnabled:
                      type: boolean
                      description: >-
                        Auto-resume when healthy capacity returns (default
                        true). false holds the trip until an operator restart.
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Running, Degraded, Error]
                nodeMapVersion:
                  type: integer
                readyNodes:
                  type: integer
                totalNodes:
                  type: integer
                migrationPhase:
                  type: string
                  enum: [None, Dumping, Forwarding]
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Partitions
          type: integer
          jsonPath: .spec.partitions
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Ready
          type: integer
          jsonPath: .status.readyNodes
        - name: Migration
          type: string
          jsonPath: .status.migrationPhase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
  scope: Namespaced
  names:
    plural: flareclusters
    singular: flarecluster
    kind: FlareCluster
    shortNames:
      - fc
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: flaremigrations.flare.gree.net
  annotations:
    # A CRD is cluster-scoped and SHARED by every flare instance; deleting it
    # cascade-deletes ALL FlareCluster/FlareMigration CRs cluster-wide. Protect
    # it from automatic deletion so no single owner's lifecycle can take it
    # down: helm never prunes it on uninstall, ArgoCD never prunes it on sync/
    # app-deletion. Remove it deliberately (kubectl) only when retiring flare
    # from the whole cluster.
    "helm.sh/resource-policy": keep
    argocd.argoproj.io/sync-options: Prune=false
spec:
  group: flare.gree.net
  names:
    kind: FlareMigration
    listKind: FlareMigrationList
    plural: flaremigrations
    singular: flaremigration
    shortNames: ["fmig"]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Source
          type: string
          jsonPath: .spec.source
        - name: Target
          type: string
          jsonPath: .spec.target.name
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Progress
          type: string
          jsonPath: .status.progress
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["source", "target"]
              properties:
                source:
                  type: string
                  description: >
                    Name of the FlareCluster to migrate FROM (same namespace).
                    The operator managing this cluster runs the migration.
                target:
                  type: object
                  required: ["name"]
                  properties:
                    name:
                      type: string
                      description: Name for the new FlareCluster (same namespace).
                    partitions:
                      type: integer
                      default: 1
                    replicas:
                      type: integer
                      default: 2
                      description: Replicas PER PARTITION (master + N-1 slaves).
                    persistenceSize:
                      type: string
                      default: "10Gi"
                      description: PVC size per target pod.
                    drainSeconds:
                      type: integer
                      default: 60
                paused:
                  type: boolean
                  default: false
                  description: >
                    Freeze the migration at its current phase. No actions are
                    taken while true; flip back to false to resume.
                approveCutover:
                  type: boolean
                  default: false
                  description: >
                    Human gate for the point of no return. The migration parks
                    in AwaitingCutover until this is true; cutover flips the
                    external Service selector to the target cluster.
                approveRetire:
                  type: boolean
                  default: false
                  description: >
                    Human gate for deleting the SOURCE cluster's StatefulSet
                    and FlareCluster CR (PVCs are always left in place).
                abort:
                  type: boolean
                  default: false
                  description: >
                    Roll the migration back: stop replication, delete the
                    target cluster. Refused after cutover (the external
                    Service already points at the target).
                externalService:
                  type: string
                  default: ""
                  description: >
                    Name of the client-facing Service whose selector is
                    flipped to the target at cutover. Empty = no Service to
                    flip (cutover is a no-op marker).
            status:
              type: object
              properties:
                phase:
                  type: string
                message:
                  type: string
                progress:
                  type: string
                sourceKeys:
                  type: integer
                targetKeys:
                  type: integer
                convergedTicks:
                  type: integer
{{- end }}
