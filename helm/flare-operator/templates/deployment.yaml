{{- if .Values.operator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flare-operator.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "flare-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "flare-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "flare-operator.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        # Every pod starts as standby; the leader overwrites its own label
        # after acquiring the lease. Deliberately NOT part of matchLabels
        # (the Deployment selector is immutable and must not track it).
        flare.gree.net/role: standby
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "flare-operator.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "flare-operator.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--namespace"
            - {{ .Values.namespace | quote }}
            - "--port"
            - {{ .Values.operatorPort | quote }}
            {{- if .Values.clusterName }}
            - "--cluster-name"
            - {{ .Values.clusterName | quote }}
            {{- end }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            # Servers read their ports from these; without the injection the
            # values only changed containerPort declarations while the
            # processes stayed on hardcoded ports (review P2-6).
            - name: FLARE_METRICS_PORT
              value: {{ .Values.metricsPort | quote }}
            - name: FLARE_HEALTH_PORT
              value: {{ .Values.healthPort | quote }}
            - name: FLARE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # the node guard trusts the operator's own deletes (rolling, repair)
            - name: FLARE_OPERATOR_SERVICE_ACCOUNT
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
            {{- if .Values.legacyMasterSwitch }}
            # accepted explicitly: masters on a flared from before the ordered
            # handover are switched by the drain (NOT loss-free)
            - name: FLARE_OPERATOR_LEGACY_MASTER_SWITCH
              value: "allow"
            {{- end }}
            {{- if .Values.nodeGuard.enabled }}
            - name: FLARE_NODE_GUARD
              value: "on"
            - name: FLARE_WEBHOOK_PORT
              value: "9444"
            {{- end }}
            {{- if .Values.clusterName }}
            - name: FLARE_CLUSTER_NAME
              value: {{ .Values.clusterName | quote }}
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: flare-index
              containerPort: {{ .Values.operatorPort }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.metricsPort }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.healthPort }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        {{- if .Values.nodeGuard.enabled }}
        # TLS for the node-guard admission webhook (A0 stage 6b): the operator
        # serves it in plain HTTP on 127.0.0.1:9444; this sidecar terminates
        # TLS with the chart-generated certificate.
        - name: webhook-tls
          image: {{ .Values.nodeGuard.tlsImage }}
          imagePullPolicy: IfNotPresent
          # The certificate is generated on every render (helm upgrade, an
          # ArgoCD sync), and the API server trusts the new CA at once, while
          # socat keeps the certificate it loaded at start: every webhook call
          # then failed TLS and, with failurePolicy Fail, every guarded delete
          # (the operator's rolling too) was refused until the operator pods
          # restarted (E2E 41181975092, helm upgrade: http 500 for 15 min).
          # socat is restarted when the mounted Secret changes (the kubelet
          # refreshes it within about a minute).
          command: ["/bin/sh", "-c"]
          args:
            - |
              sum() { cat /tls/tls.crt /tls/tls.key | md5sum; }
              while true; do
                socat OPENSSL-LISTEN:9443,reuseaddr,fork,cert=/tls/tls.crt,key=/tls/tls.key,verify=0 TCP:127.0.0.1:9444 &
                pid=$!
                s=$(sum)
                while kill -0 "$pid" 2>/dev/null && [ "$(sum)" = "$s" ]; do sleep 5; done
                echo "webhook-tls: certificate changed (or socat exited); restarting socat"
                kill "$pid" 2>/dev/null
                wait "$pid" 2>/dev/null
              done
          ports:
            - name: webhook
              containerPort: 9443
              protocol: TCP
          volumeMounts:
            - name: webhook-tls
              mountPath: /tls
              readOnly: true
          resources:
            {{- toYaml .Values.nodeGuard.tlsResources | nindent 12 }}
      volumes:
        - name: webhook-tls
          secret:
            secretName: {{ include "flare-operator.fullname" . }}-webhook-tls
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

{{- end }}
