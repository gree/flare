{{- if .Values.cluster.enabled }}
{{- /* The operator manages exactly one FlareCluster: the one named by
       .Values.clusterName in .Values.namespace. Rendering a managed
       cluster under any other name would create a CR the operator
       ignores — fail at template time instead. */}}
{{- if and .Values.clusterName (ne .Values.cluster.name .Values.clusterName) }}
{{- fail (printf "cluster.name (%s) must equal clusterName (%s): the operator only manages the FlareCluster named clusterName" .Values.cluster.name .Values.clusterName) }}
{{- end }}
{{- $c := .Values.cluster }}
{{- $ns := .Values.namespace }}
{{- /* Graceful-drain window. Computed via hasKey (NOT `| default`) so an
       explicit drainSeconds: 0 disables the hook — sprig's `default` treats 0
       as empty and would wrongly re-enable it. Absent (e.g. helm --reuse-values
       from a release predating this key) falls back to 60. */}}
{{- $drain := 60 }}
{{- if hasKey $c "drainSeconds" }}{{- $drain = $c.drainSeconds }}{{- end }}
{{- /* Storage mode: PVC (persistence.enabled) | tmpfs (memory emptyDir) |
       ephemeral (node disk /tmp). tmpfs guarded for values without the key. */}}
{{- $tmpfsEnabled := false }}
{{- $tmpfsSize := "1Gi" }}
{{- if $c.tmpfs }}{{- if $c.tmpfs.enabled }}{{- $tmpfsEnabled = true }}{{- $tmpfsSize = ($c.tmpfs.sizeLimit | default "1Gi") }}{{- end }}{{- end }}
{{- if and $c.persistence.enabled $tmpfsEnabled }}{{- fail "cluster: set only one of persistence.enabled or tmpfs.enabled" }}{{- end }}
{{- $useDataVol := or $c.persistence.enabled $tmpfsEnabled }}
{{- $dataDir := ternary "/data/flare" "/tmp/flare" $useDataVol }}
{{- /* flared mounts /etc/flared/extra.conf and exits immediately if the
       file is missing, so the ConfigMap must exist BEFORE the StatefulSet
       pods start. It is a pre-install HOOK on purpose: hook resources are
       not tracked in the release, so `helm upgrade` neither resets the
       content the operator wrote into it nor prunes it. (A lookup-guard
       variant was tried first and backfired: on upgrade the skipped
       render made helm DELETE the ConfigMap as removed-from-release.)
       Trade-off: `helm uninstall` leaves it behind — harmless. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $c.name }}-config
  namespace: {{ $ns }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-5"
data:
  extra.conf: ""
---
apiVersion: flare.gree.net/v1alpha1
kind: FlareCluster
metadata:
  name: {{ $c.name }}
  namespace: {{ $ns }}
spec:
  partitions: {{ $c.partitions }}
  replicas: {{ $c.replicas }}
  {{- /* RocksDB tuning passthrough. Fields map 1:1 to the CRD's spec.rocksdb
         (walSizeLimitMb, walTtlSeconds, syncWrites, ...); the operator emits
         only the ones set into the cluster ConfigMap. IMPORTANT for tmpfs: WAL
         archive is retained up to walSizeLimitMb (flared default 10240=10Gi) on
         the RAM-backed data dir, so on a tmpfs cluster cap it well under
         tmpfs.sizeLimit (e.g. ~5%) or the archive can fill the RAM disk. */}}
  {{- with $c.rocksdb }}
  rocksdb:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $c.name }}-nodes
  namespace: {{ $ns }}
  labels:
    app: flare
    cluster: {{ $c.name }}
spec:
  clusterIP: None
  selector:
    app: flare
    cluster: {{ $c.name }}
  ports:
    - port: {{ $c.flarePort }}
      name: flare
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $c.name }}-nodes
  namespace: {{ $ns }}
spec:
  serviceName: {{ $c.name }}-nodes
  replicas: {{ mul $c.partitions $c.replicas }}
  selector:
    matchLabels:
      app: flare
      cluster: {{ $c.name }}
  template:
    metadata:
      labels:
        app: flare
        cluster: {{ $c.name }}
        {{- with $c.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if or $c.zoneSpread $c.hostnameSpread }}
      topologySpreadConstraints:
        {{- if $c.zoneSpread }}
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: {{ eq $c.zoneSpread "hard" | ternary "DoNotSchedule" "ScheduleAnyway" }}
          labelSelector:
            matchLabels:
              app: flare
              cluster: {{ $c.name }}
        {{- end }}
        {{- if $c.hostnameSpread }}
        # One node must never hold both copies of a partition; see values.
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: {{ eq $c.hostnameSpread "hard" | ternary "DoNotSchedule" "ScheduleAnyway" }}
          labelSelector:
            matchLabels:
              app: flare
              cluster: {{ $c.name }}
        {{- end }}
      {{- end }}
      {{- if gt (int $drain) 0 }}
      # Room for the preStop drain (below) + flared's own graceful shutdown after
      # SIGTERM. Must exceed drainSeconds or K8s SIGKILLs mid-drain.
      terminationGracePeriodSeconds: {{ add (int $drain) 30 }}
      {{- end }}
      containers:
        - name: flared
          image: "{{ $c.image.repository }}:{{ $c.image.tag }}"
          imagePullPolicy: {{ $c.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              {{- if $c.persistence.enabled }}
              # Restore hook: if /data/flare/RESTORE names a checkpoint dir
              # (created by the flared `backup` op), swap it in before start.
              # See docs/BACKUP_RESTORE.md.
              if [ -f /data/flare/RESTORE ]; then
                SRC=$(cat /data/flare/RESTORE)
                rm -rf /data/flare/flare.rocksdb
                cp -a "$SRC" /data/flare/flare.rocksdb
                rm -f /data/flare/RESTORE
              fi
              mkdir -p /data/flare
              exec flared --config=/etc/flared/extra.conf --data-dir /data/flare --server-port {{ $c.flarePort }} --index-server-name {{ include "flare-operator.fullname" . }}.{{ $ns }}.svc.cluster.local --index-server-port {{ .Values.service.port }} --storage-type={{ $c.storageBackend }} --stderr
              {{- else }}
              # tmpfs (emptyDir medium=Memory) or ephemeral node disk — either way
              # the data is lost on pod restart (no restore hook: tmpfs can't
              # retain a RESTORE marker across restarts anyway).
              mkdir -p {{ $dataDir }}
              exec flared --config=/etc/flared/extra.conf --data-dir {{ $dataDir }} --server-port {{ $c.flarePort }} --index-server-name {{ include "flare-operator.fullname" . }}.{{ $ns }}.svc.cluster.local --index-server-port {{ .Values.service.port }} --storage-type={{ $c.storageBackend }} --stderr
              {{- end }}
          ports:
            - containerPort: {{ $c.flarePort }}
              name: flare
          volumeMounts:
            - name: flared-config
              mountPath: /etc/flared
            {{- if $useDataVol }}
            - name: data
              mountPath: /data
            {{- end }}
          livenessProbe:
            tcpSocket:
              port: {{ $c.flarePort }}
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
          readinessProbe:
            tcpSocket:
              port: {{ $c.flarePort }}
            initialDelaySeconds: 5
            periodSeconds: 3
            failureThreshold: 4
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          {{- if gt (int $drain) 0 }}
          lifecycle:
            preStop:
              exec:
                # Graceful drain: once the pod is Terminating it is already out
                # of the Service/CLB endpoints (no new connections) and the
                # operator promotes a slave for any partition this pod mastered
                # (TerminatingPodHandling). flared stays up for this window,
                # continuing to serve/forward the connections it still holds, so
                # clients drain or reconnect before SIGTERM. See cluster.drainSeconds.
                command: ["sh", "-c", "sleep {{ int $drain }}"]
          {{- end }}
      volumes:
        - name: flared-config
          configMap:
            name: {{ $c.name }}-config
        {{- if $tmpfsEnabled }}
        # tmpfs data dir: RAM-backed emptyDir, capped at sizeLimit (counts
        # against the pod's memory). Data is lost on pod restart — pair with
        # replicas>=2 (slave promotion) and/or off-cluster backup.
        - name: data
          emptyDir:
            medium: Memory
            sizeLimit: {{ $tmpfsSize }}
        {{- end }}
  {{- if $c.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with $c.persistence.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $c.persistence.size }}
  {{- end }}
{{- if $c.externalAccess.enabled }}
---
# Client entry point: LB over every flared pod's data port. Any node
# proxies to the key's owning partition, so no per-node exposure is
# needed. See values.yaml (cluster.externalAccess) for the security notes.
apiVersion: v1
kind: Service
metadata:
  name: {{ $c.name }}-nodes-external
  namespace: {{ $ns }}
  labels:
    app: flare
    cluster: {{ $c.name }}
  {{- with $c.externalAccess.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $c.externalAccess.type }}
  {{- with $c.externalAccess.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    app: flare
    cluster: {{ $c.name }}
  ports:
    - port: {{ $c.externalAccess.port }}
      targetPort: {{ $c.flarePort }}
      name: flare
{{- end }}
{{- if $c.pdb.enabled }}
---
# Serializes voluntary disruptions: a rolling node drain can never evict a
# partition's master and its slave at the same time. Combine with
# zoneSpread so involuntary AZ loss also cannot take both.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $c.name }}-nodes
  namespace: {{ $ns }}
spec:
  maxUnavailable: {{ $c.pdb.maxUnavailable }}
  selector:
    matchLabels:
      app: flare
      cluster: {{ $c.name }}
{{- end }}
{{- end }}
